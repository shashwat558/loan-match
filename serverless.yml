service: loan-engine

useDotenv: true

plugins:
  - serverless-python-requirements

custom:
  pythonRequirements:
    dockerizePip: true
    slim: true
    noDeploy:
      - boto3
      - botocore

provider:
  name: aws
  runtime: python3.12
  region: ap-south-1
  stage: ${opt:stage, 'dev'}

  memorySize: 256

  httpApi:
    cors: true

  environment:
    DB_HOST: ${env:DB_HOST_RDS}
    DB_PORT: ${env:DB_PORT, '5432'}
    DB_NAME: ${env:DB_NAME}
    DB_USER: ${env:DB_USER_RDS}
    DB_PASSWORD: ${env:DB_PASSWORD_RDS}

    UPLOAD_BUCKET: ${env:UPLOAD_BUCKET_RDS}

    N8N_WEBHOOK_URL: ${env:N8N_WEBHOOK_URL, ''}

    N8N_WEBHOOK_SECRET: ${env:N8N_WEBHOOK_SECRET, ''}

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
          Resource:
            - arn:aws:s3:::${env:UPLOAD_BUCKET_RDS}/uploads/*

package:
  patterns:
    - '!node_modules/**'
    - '!ui/**'
    - '!n8n/**'
    - '!sql/**'
    - '!*.csv'
    - '!.env'
    - '!test_*.py'

functions:

  # --------------------------------------------------
  # Generate presigned S3 upload URL
  # --------------------------------------------------

  getUploadUrl:
    handler: lambdas/get_upload_url/handler.handler
    timeout: 15

    events:
      - httpApi:
          path: /upload-url
          method: get


  # --------------------------------------------------
  # Batch status for UI polling
  # --------------------------------------------------

  getStatus:
    handler: lambdas/get_status/handler.handler
    timeout: 15

    events:
      - httpApi:
          path: /status/{batch_id}
          method: get


  # --------------------------------------------------
  # Process uploaded CSV
  # --------------------------------------------------

  processCsv:
    handler: lambdas/process_csv/handler.handler
    timeout: 300
    memorySize: 512




resources:

  Resources:

    UploadsBucket:
      Type: AWS::S3::Bucket

      DeletionPolicy: Retain

      Properties:

        BucketName: ${env:UPLOAD_BUCKET_RDS}

        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true

        CorsConfiguration:
          CorsRules:

            - AllowedOrigins:
                - '*'

              AllowedMethods:
                - PUT
                - GET

              AllowedHeaders:
                - '*'

        NotificationConfiguration:
          LambdaConfigurations:
            - Event: s3:ObjectCreated:*
              Filter:
                S3Key:
                  Rules:
                    - Name: prefix
                      Value: uploads/
                    - Name: suffix
                      Value: .csv
              Function: !GetAtt ProcessCsvLambdaFunction.Arn

    ProcessCsvInvokePermission:
      Type: AWS::Lambda::Permission
      Properties:
        FunctionName: !GetAtt ProcessCsvLambdaFunction.Arn
        Action: lambda:InvokeFunction
        Principal: s3.amazonaws.com
        SourceArn: !GetAtt UploadsBucket.Arn



  Outputs:

    UploadEndpoint:
      Description: Presigned upload URL API endpoint

      Value:
        Fn::Sub: >-
          https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/upload-url

    UploadsBucketName:
      Description: S3 bucket used for CSV uploads

      Value:
        Ref: UploadsBucket
